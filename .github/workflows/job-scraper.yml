name: Automated Job Scraper

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub UI

permissions:
  contents: write # Needed to commit the jobs.json file back

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Puppeteer Browsers
        # Puppeteer requires system dependencies to run headless Chrome in Ubuntu
        run: npx puppeteer browsers install chrome

      - name: Run Job Scraper Script
        run: node scripts/fetch-jobs.mjs

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/jobs.json
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update latest jobs via automated scraper"
          git push
